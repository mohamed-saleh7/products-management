<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management System</title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">


</head>


<body>


    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <span class="navbar-brand mb-0 h1">
                Product Management System
            </span>

        </div>

    </nav>





    <div class="container py-5">


        <h2 class="mb-4">
            Add Product
        </h2>





        <!-- Product Form -->

        <form id="productForm" class="card shadow p-4">



            <div class="mb-3">

                <label class="form-label">
                    Product Name
                </label>


                <input type="text" id="productName" class="form-control" placeholder="Enter product name" required>


            </div>





            <div class="mb-3">

                <label class="form-label">
                    Product Price
                </label>


                <input type="number" id="productPrice" class="form-control" placeholder="Enter product price" required>


            </div>





            <div class="mb-3">

                <label class="form-label">
                    Product Image
                </label>


                <select id="productImage" class="form-select">


                    <option value="assets/images/phone.jpg">
                        Phone
                    </option>


                    <option value="assets/images/laptop.jpg">
                        Laptop
                    </option>


                    <option value="assets/images/watch.jpg">
                        Watch
                    </option>


                </select>


            </div>





            <button type="submit" class="btn btn-primary">

                Add Product

            </button>



        </form>







        <!-- Search -->

        <div class="mt-5">


            <h2>
                Products
            </h2>



            <input id="searchInput" type="search" class="form-control my-3" placeholder="Search product">



        </div>









        <!-- Products will appear here -->


        <div id="productsContainer" class="row g-4">


        </div>





    </div>








    <script src="js/app.js"></script>

    <script src="js/main.js"></script>



</body>

</html>
